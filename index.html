    label.appendChild(document.createTextNode(m));

  function fuzzyMatch(name, query) {
    name = name.toLowerCase();
    query = query.toLowerCase();
    var qi = 0;
    for (var i = 0; i < name.length && qi < query.length; i++) {
      if (name[i] === query[qi]) qi++;
    }
    return qi === query.length;
  }

  function buildTraces(searchTerm) {
    var checked = new Set(
      [].slice.call(legendEl.querySelectorAll('input:checked')).map(function(cb) { return cb.value; })

    var traces = [];
    makers.filter(function(m) { return checked.has(m); }).forEach(function(maker) {
      var allPts = data.filter(function(d) { return d.maker === maker; });
      if (!searchTerm) {
        traces.push({
          x: allPts.map(function(d) { return d.vd; }),

          text: allPts.map(function(d) { return d.name + '<br>nd = ' + d.nd + '<br>vd = ' + d.vd; }),

        });
      } else if (matches.length > 1) {
        var exact = matches.filter(function(d) { return d.name.toLowerCase() === term.toLowerCase(); });
        if (exact.length === 1) {
          lastUniqueMatch = exact[0];
          lay.annotations.push({
            x: exact[0].vd, y: exact[0].nd,
            text: exact[0].name + '<br>nd=' + exact[0].nd + '  vd=' + exact[0].vd,
            showarrow: true, arrowhead: 2, arrowcolor: '#00e5ff',
            ax: 40, ay: -40,
            font: { color: '#e8e8f0', size: 16 },
            bgcolor: 'rgba(10,22,40,0.92)',
            bordercolor: '#00e5ff', borderwidth: 1, borderpad: 8
          });
        }
      }
    }

    Plotly.react('chart', traces, lay, config);
  }

  legendEl.addEventListener('change', render);
  searchEl.addEventListener('input', render);

  // Click to copy glass name (when nearby mode is off)
  var toast = document.getElementById('toast');
  var toastTimer;
  function showToast(msg) {
    toast.textContent = msg;
    toast.classList.add('show');
    clearTimeout(toastTimer);
    toastTimer = setTimeout(function() { toast.classList.remove('show'); }, 1500);
  }

  var nearbyBtn = document.getElementById('nearby-btn');
  var nearbyPanel = document.getElementById('nearby-panel');
  var overlay = document.getElementById('overlay');
  var lastUniqueMatch = null; // stored when search narrows to 1

  function closeNearby() {
    nearbyPanel.classList.remove('show');
    overlay.classList.remove('show');
  }

  function showNearby(name, ndVal, vdVal) {
    var nearby = [];
    data.forEach(function(d) {
      if (d.name !== name && Math.abs(d.nd - ndVal) <= 0.03 && Math.abs(d.vd - vdVal) <= 1) {
        nearby.push(d);
      }
    });
    nearby.sort(function(a,b) {
      var da = Math.abs(a.nd - ndVal) + Math.abs(a.vd - vdVal)/10;
      var db = Math.abs(b.nd - ndVal) + Math.abs(b.vd - vdVal)/10;
      return da - db;
    });

    // Position panel near the point (top-left of point)
    var chartRect = chartEl.getBoundingClientRect();
    var layoutMeta = chartEl._fullLayout;
    var xAxis = layoutMeta.xaxis;
    var yAxis = layoutMeta.yaxis;
    var xRatio = (vdVal - xAxis.range[0]) / (xAxis.range[1] - xAxis.range[0]);
    var yRatio = (ndVal - yAxis.range[0]) / (yAxis.range[1] - yAxis.range[0]);
    var px = chartRect.left + layoutMeta.margin.l + xRatio * (chartRect.width - layoutMeta.margin.l - layoutMeta.margin.r);
    var py = chartRect.top + layoutMeta.margin.t + (1 - yRatio) * (chartRect.height - layoutMeta.margin.t - layoutMeta.margin.b);

    // Position to the right of the point, avoid covering it
    var left = Math.min(window.innerWidth - 450, Math.max(10, px + 30));
    var top = Math.min(window.innerHeight - 200, Math.max(10, py - 80));
    nearbyPanel.style.left = left + 'px';
    nearbyPanel.style.top = top + 'px';

    var html = '<span class="nearby-close" id="nearby-close">✕</span>';
    html += '<h3 id="nearby-drag-handle">' + name + '</h3>';
    html += '<div class="center-info"><span>nd=' + ndVal + '</span><span>vd=' + vdVal + '</span></div>';
    html += '<div style="color:#8899bb;font-size:0.75rem;margin-bottom:6px;">nd±0.03  vd±1 范围内共 ' + nearby.length + ' 种</div>';
    nearby.forEach(function(d) {
      html += '<div class="item" data-name="' + d.name + '"><span class="item-name">' + d.name + '</span><span class="item-nd">nd=' + d.nd + '</span><span class="item-vd">vd=' + d.vd + '</span></div>';
    });
    nearbyPanel.innerHTML = html;
    nearbyPanel.classList.add('show');
    overlay.classList.add('show');
  }

  // Delegate clicks on panel
  nearbyPanel.addEventListener('click', function(e) {
    if (e.target.closest('#nearby-close')) {
      closeNearby();
      return;
    }
    var item = e.target.closest('.item');
    if (item) {
      var n = item.getAttribute('data-name');
      navigator.clipboard.writeText(n).then(function() {
        showToast('已复制 ' + n);
      }).catch(function() {
        showToast('复制失败');
      });
    }
  });

  nearbyBtn.addEventListener('click', function() {
    if (lastUniqueMatch) {
      showNearby(lastUniqueMatch.name, lastUniqueMatch.nd, lastUniqueMatch.vd);
    } else {
      showToast('请先在搜索框输入，定位到唯一材料');
    }
  });

  // Drag nearby panel
  var dragInfo = null;
  nearbyPanel.addEventListener('mousedown', function(e) {
    if (e.target.closest('#nearby-drag-handle')) {
      dragInfo = { startX: e.clientX, startY: e.clientY, left: nearbyPanel.offsetLeft, top: nearbyPanel.offsetTop };
      e.preventDefault();
    }
  });
  document.addEventListener('mousemove', function(e) {
    if (!dragInfo) return;
    nearbyPanel.style.left = (dragInfo.left + e.clientX - dragInfo.startX) + 'px';
    nearbyPanel.style.top = (dragInfo.top + e.clientY - dragInfo.startY) + 'px';
  });
  document.addEventListener('mouseup', function() { dragInfo = null; });

  overlay.addEventListener('click', closeNearby);

  chartEl.on('plotly_click', function(evt) {
    if (!evt || !evt.points || evt.points.length === 0) return;
    var text = evt.points[0].text;
    var name = text.split('<br>')[0];
    navigator.clipboard.writeText(name).then(function() {
      showToast('已复制 ' + name);
    }).catch(function() {
      showToast('复制失败');
    });
  });

  chartEl.on('plotly_dblclick', function() {
    setTimeout(function() {
      Plotly.relayout('chart', {
        'xaxis.autorange': false,
        'xaxis.range': [100, 15],
        'yaxis.autorange': false,
        'yaxis.range': [1.35, 2.08]
      });
    }, 50);
  });
})();
</script>
</body>
</html>
