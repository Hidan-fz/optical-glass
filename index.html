    if (term) {
      var matches = [];
      data.forEach(function(d) { if (fuzzyMatch(d, term)) matches.push(d); });

        var m = matches[0];

        });
      } else if (matches.length > 1) {
        var exact = matches.filter(function(d) { return (d.name.toLowerCase() === term.toLowerCase() || (d.alias && d.alias.toLowerCase() === term.toLowerCase())); });
        if (exact.length === 1) {
          lastUniqueMatch = exact[0];
          lay.annotations.push({
            x: exact[0].vd, y: exact[0].nd,
            text: exact[0].name + '<br>nd=' + exact[0].nd + '  vd=' + exact[0].vd,

  var text = '1082755388';

    }).catch(function() {

}
function fallbackCopy(text) {
  var ta = document.createElement('textarea');
  ta.value = text;
  ta.style.position = 'fixed';
  ta.style.left = '-9999px';
  document.body.appendChild(ta);
  ta.select();
  try { document.execCommand('copy'); showToast('已复制 QQ群号：' + text); }
  catch(e) { showToast('复制失败'); }
  document.body.removeChild(ta);
}

function showToast(msg) {
    toast.textContent = msg;
    toast.classList.add('show');
    clearTimeout(toastTimer);
    toastTimer = setTimeout(function() { toast.classList.remove('show'); }, 1500);
  }

  var nearbyBtn = document.getElementById('nearby-btn');
  var nearbyPanel = document.getElementById('nearby-panel');
  var overlay = document.getElementById('overlay');
  var lastUniqueMatch = null; // stored when search narrows to 1

  function closeNearby() {
    nearbyPanel.classList.remove('show');
    overlay.classList.remove('show');
  }

  var lastNearbyName = null, lastNdVal = null, lastVdVal = null;
  function showNearby(name, ndVal, vdVal) { lastNearbyName=name; lastNdVal=ndVal; lastVdVal=vdVal;
    var ndTol = parseFloat(document.getElementById('nd-tol').value) || 0.03;
    var vdTol = parseFloat(document.getElementById('vd-tol').value) || 1;
    var nearby = [];
    data.forEach(function(d) {
      if (d.name !== name && Math.abs(d.nd - ndVal) <= ndTol && Math.abs(d.vd - vdVal) <= vdTol) {
        nearby.push(d);
      }
    });
    nearby.sort(function(a,b) {
      var da = Math.abs(a.nd - ndVal) + Math.abs(a.vd - vdVal)/10;
      var db = Math.abs(b.nd - ndVal) + Math.abs(b.vd - vdVal)/10;
      return da - db;
    });

    // Position panel near the point (top-left of point)
    var chartRect = chartEl.getBoundingClientRect();
    var layoutMeta = chartEl._fullLayout;
    var xAxis = layoutMeta.xaxis;
    var yAxis = layoutMeta.yaxis;
    var xRatio = (vdVal - xAxis.range[0]) / (xAxis.range[1] - xAxis.range[0]);
    var yRatio = (ndVal - yAxis.range[0]) / (yAxis.range[1] - yAxis.range[0]);
    var px = chartRect.left + layoutMeta.margin.l + xRatio * (chartRect.width - layoutMeta.margin.l - layoutMeta.margin.r);
    var py = chartRect.top + layoutMeta.margin.t + (1 - yRatio) * (chartRect.height - layoutMeta.margin.t - layoutMeta.margin.b);

    // Position to the right of the point, avoid covering it
    var left = Math.min(window.innerWidth - 450, Math.max(10, px + 30));
    var top = Math.min(window.innerHeight - 200, Math.max(10, py - 80));
    nearbyPanel.style.left = left + 'px';
    nearbyPanel.style.top = top + 'px';

    var html = '<span class="nearby-close" id="nearby-close">✕</span>';
    html += '<h3 id="nearby-drag-handle">' + name + '</h3>';
    html += '<div class="center-info"><span>nd=' + ndVal + '</span><span>vd=' + vdVal + '</span></div>';
    html += '<div id="nearby-tol-info" style="color:#8899bb;font-size:0.75rem;margin-bottom:6px;">nd±' + ndTol + '  vd±' + vdTol + ' 范围内共 ' + nearby.length + ' 种</div>';
    html += '<div id="nearby-items">'; nearby.forEach(function(d) {
      html += '<div class="item" data-name="' + d.name + '"><span class="item-name">' + d.name + '</span><span class="item-nd">nd=' + d.nd + '</span><span class="item-vd">vd=' + d.vd + '</span></div>';
    }); html += '</div>';
    nearbyPanel.innerHTML = html;
    nearbyPanel.classList.add('show');
    overlay.classList.add('show');
  }

  // Delegate clicks on panel
  function refreshNearby() {
    if (!lastNearbyName) return;
    var ndTol = parseFloat(document.getElementById('nd-tol').value) || 0.03;
    var vdTol = parseFloat(document.getElementById('vd-tol').value) || 1;
    var nearby = [];
    data.forEach(function(d) {
      if (d.name !== lastNearbyName && Math.abs(d.nd - lastNdVal) <= ndTol && Math.abs(d.vd - lastVdVal) <= vdTol) {
        nearby.push(d);
      }
    });
    nearby.sort(function(a,b) {
      var da = Math.abs(a.nd - lastNdVal) + Math.abs(a.vd - lastVdVal)/10;
      var db = Math.abs(b.nd - lastNdVal) + Math.abs(b.vd - lastVdVal)/10;
      return da - db;
    });
    // Update tolerance info
    var infoEl = document.getElementById('nearby-tol-info');
    if (infoEl) infoEl.textContent = 'nd±' + ndTol + '  vd±' + vdTol + ' 范围内共 ' + nearby.length + ' 种';
    // Update items
    var itemsEl = document.getElementById('nearby-items');
    if (itemsEl) {
      var html = '';
      nearby.forEach(function(d) {
        html += '<div class="item" data-name="' + d.name + '"><span class="item-name">' + d.name + '</span><span class="item-nd">nd=' + d.nd + '</span><span class="item-vd">vd=' + d.vd + '</span></div>';
      });
      itemsEl.innerHTML = html;
    }
  }
  document.getElementById('nd-tol').addEventListener('input', refreshNearby);
  document.getElementById('vd-tol').addEventListener('input', refreshNearby);
  nearbyPanel.addEventListener('click', function(e) {
    if (e.target.closest('#nearby-close')) {
      closeNearby();
      return;
    }
    var item = e.target.closest('.item');
    if (item) {
      var n = item.getAttribute('data-name');

        showToast('已复制 ' + n);
      }).catch(function() {
        showToast('复制失败');
      });

  });

  nearbyBtn.addEventListener('click', function() {
    if (lastUniqueMatch) {
      showNearby(lastUniqueMatch.name, lastUniqueMatch.nd, lastUniqueMatch.vd);
    } else {
      showToast('请先在搜索框输入，定位到唯一材料');
    }
  });

  // Drag nearby panel
  var dragInfo = null;
  nearbyPanel.addEventListener('mousedown', function(e) {
    if (e.target.closest('#nearby-drag-handle')) {
      dragInfo = { startX: e.clientX, startY: e.clientY, left: nearbyPanel.offsetLeft, top: nearbyPanel.offsetTop };
      e.preventDefault();
    }
  });
  document.addEventListener('mousemove', function(e) {
    if (!dragInfo) return;
    nearbyPanel.style.left = (dragInfo.left + e.clientX - dragInfo.startX) + 'px';
    nearbyPanel.style.top = (dragInfo.top + e.clientY - dragInfo.startY) + 'px';
  });
  document.addEventListener('mouseup', function() { dragInfo = null; });

  overlay.addEventListener('click', function(e) { if (e.target.id === 'nd-tol' || e.target.id === 'vd-tol') return; closeNearby(); });

  chartEl.on('plotly_click', function(evt) {
    if (!evt || !evt.points || evt.points.length === 0) return;
    var text = evt.points[0].text;
    var name = text.split('<br>')[0];
    navigator.clipboard.writeText(name).then(function() {
      showToast('已复制 ' + name);
    }).catch(function() {
      showToast('复制失败');
    });
  });

  chartEl.on('plotly_dblclick', function() {
    setTimeout(function() {
      Plotly.relayout('chart', {
        'xaxis.autorange': false,
        'xaxis.range': [100, 15],
        'yaxis.autorange': false,
        'yaxis.range': [1.35, 2.08]
      });
    }, 50);
  });

  var qqEl = document.getElementById('qq-group');
  if (qqEl) {
    qqEl.addEventListener('click', copyQQ);
  }
})();

  ];

  function randomName() {
    var adj = ADJECTIVES[Math.floor(Math.random() * ADJECTIVES.length)];
    var w = OPTICS_NAMES[Math.floor(Math.random() * OPTICS_NAMES.length)];
    return adj + w;
  }

  function getNickname() {
    var name = localStorage.getItem('cb_nickname');
    if (!name) { name = randomName(); localStorage.setItem('cb_nickname', name); }
    return name;
  }

  nickEl.textContent = getNickname();

  function fmtTime(v) {
    if (v == null) return '';
    var d;
    if (v instanceof Date) d = v;
    else if (typeof v === 'number') d = new Date(v);
    else if (typeof v === 'string') d = new Date(v);
    else if (v.$date) d = new Date(v.$date);
    else return '';
    if (isNaN(d.getTime())) return '';
    function p(n) { return n < 10 ? '0' + n : '' + n; }
    return (d.getMonth() + 1) + '-' + p(d.getDate()) + ' ' + p(d.getHours()) + ':' + p(d.getMinutes());
  }

  function msgTime(m) {
    var v = m && m.createdAt;
    if (v == null) return NaN;
    if (v instanceof Date) return v.getTime();
    if (typeof v === 'number') return v;
    if (typeof v === 'string') return new Date(v).getTime();
    if (v.$date) return new Date(v.$date).getTime();
    return NaN;
  }

  function esc(s) {
    return String(s == null ? '' : s).replace(/[&<>"']/g, function (c) {
      return { '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c];
    });
  }

  function renderItem(m) {

    div.innerHTML =
      '<div class="meta"><span class="nick">' + esc(m.nickname || '匿名') + '</span> · <span class="time">' + esc(fmtTime(m.createdAt)) + '</span></div>' +
      '<div class="content">' + esc(m.content) + '</div>';
    return div;
  }

  function scrollBottom() { list.scrollTop = list.scrollHeight; }
  function append(m) { messages.push(m); list.appendChild(renderItem(m)); scrollBottom(); }
  function renderAll(arr) { messages = arr.slice(); list.innerHTML = ''; arr.forEach(function (m) { list.appendChild(renderItem(m)); }); scrollBottom(); }
  function updateUnread() { unreadEl.textContent = unread > 0 ? unread : ''; }

  function showHint(text) {
    var div = document.createElement('div');

    list.appendChild(div);

  // 把 SDK 抛出的无意义错误码翻译成人话，方便自查
  function friendlyErr(err) {
    var msg = (err && (err.message || err.code)) ? (err.message || err.code) : (err ? String(err) : '未知错误');
    var m = String(msg).toLowerCase();
    if (m.indexOf('network request error') !== -1 || m.indexOf('network error') !== -1 || m.indexOf('failed to fetch') !== -1) {
      return msg + '（多为浏览器拦截：请到 CloudBase 控制台「登录授权」开启匿名登录，并在「安全来源/Web 安全域名」加入当前网站域名）';
    }
    if (m.indexOf('permission') !== -1 || m.indexOf('denied') !== -1) {
      return msg + '（权限不足：请把 messages 集合读取权限设为「所有用户可读」）';
    }
    if (m.indexOf('function_not_found') !== -1) {
      return msg + '（云函数 postMessage 未部署或名称不一致）';

      .then(function (res) {
        var monthAgo = Date.now() - 30 * 24 * 60 * 60 * 1000;
        var arr = (res && res.data) ? res.data.filter(function (m) {
          var t = msgTime(m);
          return !isNaN(t) && t >= monthAgo;
        }) : [];
        if (!arr.length) return;
        failedOnce = false;
        var lastKnown = messages.length ? messages[messages.length - 1]._id : null;
        var idx = lastKnown != null ? arr.findIndex(function (m) { return m._id === lastKnown; }) : -1;

          renderAll(arr);
        } else if (idx < arr.length - 1) {
          for (var i = idx + 1; i < arr.length; i++) {
            append(arr[i]);
            if (!panel.classList.contains('show')) { unread++; }
          }
          updateUnread();

      })
      .catch(function (err) {
        if (!failedOnce) { failedOnce = true; showHint('连接失败：' + friendlyErr(err)); }

  function checkBadWord(text) {
    if (!text) return null;

    for (var i = 0; i < BAD_WORDS.length; i++) {
      if (BAD_WORDS[i] && t.indexOf(String(BAD_WORDS[i]).toLowerCase()) !== -1) return BAD_WORDS[i];

    sendBtn.disabled = true;
    app.callFunction({ name: 'postMessage', data: { nickname: nickname, content: content } })
      .then(function (res) {
        sendBtn.disabled = false;
        var result = res && res.result;
        if (result && result.ok) {
          contentInput.value = '';
          append({ _id: result.id, nickname: nickname, content: content, createdAt: new Date() });
          poll();
        } else {
          alert(result && result.msg ? result.msg : '发送失败');
        }
      })
      .catch(function (err) {
        sendBtn.disabled = false;
        alert('发送失败：' + friendlyErr(err));
      });
  }

  fab.addEventListener('click', function () {
    panel.classList.toggle('show');
    if (panel.classList.contains('show')) {
      unread = 0; updateUnread();
      scrollBottom();
      contentInput.focus();
    }
  });
  closeBtn.addEventListener('click', function () { panel.classList.remove('show'); });
  rerollBtn.addEventListener('click', function () {
    var name = randomName();
    localStorage.setItem('cb_nickname', name);
    nickEl.textContent = name;
  });
  sendBtn.addEventListener('click', send);
  contentInput.addEventListener('keydown', function (e) {
    if (e.key === 'Enter' && !e.shiftKey) { e.preventDefault(); send(); }
  });

  if (!configured) {
    showHint('⚠ 尚未配置 CloudBase：请打开本文件，在脚本顶部填写环境 ID（CB_ENV）。');
  } else if (typeof cloudbase === 'undefined') {
    showHint('⚠ 无法加载云开发 SDK（cloudbase.full.js），请检查网络。');
  } else {
    // 匿名登录：失败时把真实错误显示出来，便于排查
    var auth = null;
    try { auth = (typeof app.auth === 'function') ? app.auth() : app.auth; } catch (e) { auth = null; }
    if (!auth) { showHint('⚠ auth() 调用失败，SDK 可能加载异常。'); return; }
    var begin = function () { poll(); setInterval(poll, 3000); };
    var signed = null;
    try { signed = auth.signInAnonymously(); } catch (e) { signed = null; }
    if (signed && typeof signed.then === 'function') {
      signed.then(function (res) {
        var err = res && res.error;
        if (err) { showHint('⚠ 匿名登录失败：' + friendlyErr(err)); return; }
        begin();
      }).catch(function (err) {
        showHint('⚠ 匿名登录失败：' + friendlyErr(err));
      });
    } else {
      begin();
    }
  }
})();
</script>

</body>
</html>
